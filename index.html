<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riciclean — Réservation</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="site" src="riciclean_reservation_v2_photos.html" title="Riciclean"></iframe>
<iframe id="sendFrame" name="sendFrame" style="display:none"></iframe>

<script>
const site = document.getElementById('site');

site.addEventListener('load', function () {
  const doc = site.contentDocument;
  const form = doc && doc.getElementById('quoteForm');
  if (!form || form.dataset.emailReady) return;

  form.dataset.emailReady = '1';
  form.setAttribute('method', 'POST');
  form.setAttribute('action', 'https://formsubmit.co/Riciclean@gmail.com');
  form.setAttribute('enctype', 'multipart/form-data');
  form.setAttribute('target', 'sendFrame');

  const fields = {
    name: 'name',
    phone: 'phone',
    email: 'email',
    address: 'address',
    type: 'type',
    date: 'date',
    details: 'details',
    photos: 'photos'
  };

  Object.keys(fields).forEach(function(id){
    const el = doc.getElementById(id);
    if (el) el.setAttribute('name', fields[id]);
  });

  const hidden = [
    ['_subject', 'Nouvelle demande de devis Riciclean'],
    ['_template', 'table'],
    ['_url', 'https://riciclean.github.io/Riciclean/']
  ];

  hidden.forEach(function(pair){
    const input = doc.createElement('input');
    input.type = 'hidden';
    input.name = pair[0];
    input.value = pair[1];
    form.appendChild(input);
  });

  form.addEventListener('submit', function(){
    const success = doc.getElementById('success');
    if (success) {
      success.innerHTML = 'Merci ! Votre demande a bien été envoyée à Riciclean. Nous vous recontacterons rapidement.';
      success.style.display = 'block';
      setTimeout(function(){
        success.scrollIntoView({behavior:'smooth', block:'center'});
      }, 100);
    }
  });
});
</script>
</body>
</html>
